---
layout: default
title: Blog
---
<section class="intro">
  <h1 class="statement">Blog</h1>
  <p class="about">I write about neural nets, AI and programming.{% if site.posts.size == 0 %} No posts yet.{% endif %}</p>
</section>

{% for post in site.posts %}
<article class="block">
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
  <div class="entry">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
    <p>{{ post.excerpt | strip_html }}</p>
  </div>
</article>
{% endfor %}
